<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бронирование номера — Сладкие сны</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1 class="brand-name">Сладкие сны — Бронирование</h1>
        <p class="brand-slogan">«Ваш отдых — наша забота»</p>
      </div>
      <nav class="main-nav">
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="#">Вход</a>
      </nav>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="site-main">
    <section class="booking-section">
      <h2>Бронирование номера</h2>
      <p class="room-info" id="roomInfo">Загрузка информации о номере…</p>

      <form class="booking-form" id="bookingForm" novalidate>
        <input type="hidden" name="room_id" id="roomId" value="">

        <div class="form-group">
          <label for="firstName">Имя <span class="required">*</span></label>
          <input type="text" id="firstName" name="firstName"
                 placeholder="Иван" autocomplete="given-name">
          <span class="field-error" id="errFirstName"></span>
        </div>

        <div class="form-group">
          <label for="lastName">Фамилия <span class="required">*</span></label>
          <input type="text" id="lastName" name="lastName"
                 placeholder="Иванов" autocomplete="family-name">
          <span class="field-error" id="errLastName"></span>
        </div>

        <div class="form-group">
          <label for="phone">Телефон <span class="required">*</span></label>
          <input type="tel" id="phone" name="phone"
                 placeholder="+7(999)123-45-67" autocomplete="tel">
          <span class="field-error" id="errPhone"></span>
        </div>

        <div class="form-group">
          <label for="email">E-mail <span class="required">*</span></label>
          <input type="email" id="email" name="email"
                 placeholder="user@example.com" autocomplete="email">
          <span class="field-error" id="errEmail"></span>
        </div>

        <div class="form-group">
          <label for="checkIn">Дата заезда <span class="required">*</span></label>
          <input type="text" id="checkIn" name="checkIn"
                 placeholder="ДД.ММ.ГГГГ" autocomplete="off">
          <span class="field-error" id="errCheckIn"></span>
        </div>

        <div class="form-group">
          <label for="checkOut">Дата выезда <span class="required">*</span></label>
          <input type="text" id="checkOut" name="checkOut"
                 placeholder="ДД.ММ.ГГГГ" autocomplete="off">
          <span class="field-error" id="errCheckOut"></span>
        </div>

        <button type="submit" class="btn btn-primary">Отправить заявку</button>
        <p class="form-note"><span class="required" style="color:#d9534f">*</span> — обязательные поля</p>
      </form>

      <div class="alert alert-success" id="successAlert"></div>
      <div class="alert alert-error" id="errorAlert"></div>
    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <address class="contacts">
      <p><strong>Адрес:</strong> г. Москва, ул. Примерная, д. 10</p>
      <p><strong>Режим работы:</strong> круглосуточно, без выходных</p>
      <p><strong>Телефон:</strong> <a href="tel:+74951234567">+7(495)123-45-67</a></p>
      <p><strong>E-mail:</strong> <a href="mailto:info@sladkie-sny.ru">info@sladkie-sny.ru</a></p>
    </address>
  </footer>

  <script src="assets/booking.js"></script>
</body>
</html>
