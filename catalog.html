<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог номеров — Сладкие сны</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1 class="brand-name">Сладкие сны — Каталог</h1>
        <p class="brand-slogan">«Ваш отдых — наша забота»</p>
      </div>
      <nav class="main-nav">
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="#">Вход</a>
      </nav>
    </div>
  </header>

  <!-- ================= MAIN ================= -->
  <main class="site-main">

    <!-- Фильтр -->
    <section class="filter-panel">
      <h3>Фильтр номеров</h3>
      <form class="filter-form" id="filterForm">
        <label>
          Категория
          <select name="category" id="filterCategory">
            <option value="">Любая</option>
            <option value="standard">Стандартный</option>
            <option value="studio">Студия</option>
            <option value="lux">Люкс</option>
          </select>
        </label>

        <label>
          Цена от, ₽
          <input type="number" name="price_min" id="filterPriceMin" min="0" placeholder="0">
        </label>

        <label>
          Цена до, ₽
          <input type="number" name="price_max" id="filterPriceMax" min="0" placeholder="10000">
        </label>

        <label>
          Кол-во мест
          <select name="capacity" id="filterCapacity">
            <option value="">Любое</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3 и более</option>
          </select>
        </label>

        <div class="filter-actions">
          <button type="submit" class="btn btn-primary">Применить</button>
          <button type="button" class="btn btn-secondary" id="resetFilter">Сбросить фильтр</button>
        </div>
      </form>
    </section>

    <!-- Сетка номеров -->
    <section class="room-grid" id="roomGrid"></section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <address class="contacts">
      <p><strong>Адрес:</strong> г. Москва, ул. Примерная, д. 10</p>
      <p><strong>Режим работы:</strong> круглосуточно, без выходных</p>
      <p><strong>Телефон:</strong> <a href="tel:+74951234567">+7(495)123-45-67</a></p>
      <p><strong>E-mail:</strong> <a href="mailto:info@sladkie-sny.ru">info@sladkie-sny.ru</a></p>
    </address>
  </footer>

  <script src="assets/catalog.js"></script>
</body>
</html>
